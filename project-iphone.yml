# The iPhone + iPad app with no entitlements, so a free Apple team can sign it. Everything comes
# from project.yml; only the app's dependency list is repeated. The Apple Watch app is paused
# (ADR-572) and is in neither project; it lives in project-watch.yml. scripts/check_platform_specs.py
# keeps the two lists in step.
# Generate on a Mac with:  make project-iphone   -> DoddyiPhone.xcodeproj
include:
  - project.yml
name: DoddyiPhone
# No entitlements in this project, so a Personal (free) Apple team can sign and install it: such a
# team can't have Sign in with Apple, App Groups or push. A Debug build talks to Doddy without Apple
# sign-in (Settings > Voice > "Developer: talk without Apple sign-in", PR #108). The widgets and
# "Save to Doddy" can't work without App Groups, so they are left out of the app here (owner, 23 Oct
# 2026): Xcode asks for a team for the app alone. The shipping project (project.yml) keeps its
# entitlements and both extensions.
settings:
  base:
    DODDY_APP_ENTITLEMENTS: ""
    DODDY_WIDGET_ENTITLEMENTS: ""
    DODDY_SHARE_ENTITLEMENTS: ""
    # The code uses plain string literals, never Xcode's generated string symbols. With them on, the
    # widgets' catalog has two keys that differ only by a capital ("New note in Doddy" and
    # "New Note in Doddy") and Xcode refuses to build.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Doddy:
    dependencies:REPLACE:
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
      - package: LiveKit
# Only the iPhone app's scheme here.
schemes:REPLACE:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      # The tests read the English screens; the app's default is Polish (ADR-573).
      language: en
      region: US
      targets:
        - DoddyTests
        - DoddyUITests
