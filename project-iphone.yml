# The iPhone + iPad app without the Apple Watch app, for iPhone/iPad work: a watch compile error
# can't break this build, and it builds faster. Everything comes from project.yml; only the app's
# dependency list is replaced, the same list minus `DoddyWatch`. Ship from project.yml, which
# embeds the watch app. scripts/check_platform_specs.py keeps the two lists in step.
# Generate on a Mac with:  make project-iphone   -> DoddyiPhone.xcodeproj
include:
  - project.yml
name: DoddyiPhone
# No entitlements in this project, so a Personal (free) Apple team can sign and install it: such a
# team can't have Sign in with Apple, App Groups or push. Apple sign-in is off in the code anyway
# (VoiceAccess, ADR-549). The cost: widgets and "Save to Doddy" say they aren't set up. The shipping
# project (project.yml) keeps its entitlements.
settings:
  base:
    DODDY_APP_ENTITLEMENTS: ""
    DODDY_WIDGET_ENTITLEMENTS: ""
    DODDY_SHARE_ENTITLEMENTS: ""
    # The code uses plain string literals, never Xcode's generated string symbols. With them on, the
    # widgets' catalog has two keys that differ only by a capital ("New note in Doddy" and
    # "New Note in Doddy") and Xcode refuses to build.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Doddy:
    dependencies:REPLACE:
      - target: DoddyWidgets
      - target: DoddyShare
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
      - package: LiveKit
# Only the iPhone app's scheme here; the watch app has its own in project.yml.
schemes:REPLACE:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      targets:
        - DoddyTests
        - DoddyUITests
