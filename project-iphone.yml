# The iPhone + iPad app with only the HealthKit entitlement, so a free Apple team can sign it. Everything comes
# from project.yml; only the app's dependency list is repeated. The Apple Watch app is paused
# (ADR-572) and is in neither project; it lives in project-watch.yml. scripts/check_platform_specs.py
# keeps the two lists in step.
# Generate on a Mac with:  make project-iphone   -> DoddyiPhone.xcodeproj
include:
  - project.yml
name: DoddyiPhone
# Only HealthKit here (ADR-621; Apple lists it for free accounts), so a Personal (free) Apple team can
# sign and install it: such a team can't have Sign in with Apple, App Groups or push. A Debug build talks to Doddy without Apple
# sign-in (Settings > Voice > "Developer: talk without Apple sign-in", PR #108). The cost: widgets
# and "Save to Doddy" say they aren't set up. The shipping project (project.yml) keeps its
# entitlements.
settings:
  base:
    # HealthKit only. If a Personal team can't sign it, set this to "" (the Health screen then says so).
    DODDY_APP_ENTITLEMENTS: Config/DoddyiPhone-HealthKit.entitlements
    DODDY_WIDGET_ENTITLEMENTS: ""
    DODDY_SHARE_ENTITLEMENTS: ""
    # The code uses plain string literals, never Xcode's generated string symbols. With them on, the
    # widgets' catalog has two keys that differ only by a capital ("New note in Doddy" and
    # "New Note in Doddy") and Xcode refuses to build.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  Doddy:
    dependencies:REPLACE:
      - target: DoddyWidgets
      - target: DoddyShare
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
      - package: LiveKit
# Only the iPhone app's scheme here.
schemes:REPLACE:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      # The tests read the English screens; the app's default is Polish (ADR-573).
      language: en
      region: US
      targets:
        - DoddyTests
        - DoddyUITests
