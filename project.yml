# XcodeGen spec for the Doddy iPhone app (https://github.com/yonaskolb/XcodeGen).
# `Doddy.xcodeproj` is GENERATED from this file and is intentionally not committed:
# no Xcode was available to open or build a generated project when M0 was authored.
# Generate on a Mac with:  make project      (needs `brew install xcodegen`)
name: Doddy
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  DoddyCore:
    path: Packages/DoddyCore
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    exactVersion: 3.3.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # No signing team is committed. Select your own team in Xcode to run on a device.
    DEVELOPMENT_TEAM: ""
    # Override this at build time for an isolated simulator install; keep the owner's default.
    DODDY_APP_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev
    # Push notifications from the Doddy messaging server (ADR-142, ADR-174). Off by default so a
    # free Apple ID can still build to a device (free teams can't use Push). With a paid team that
    # has Push enabled, set this to DoddyApp/Doddy.entitlements (here or on the xcodebuild line).
    DODDY_PUSH_ENTITLEMENTS: ""
targets:
  Doddy:
    type: application
    platform: iOS
    sources:
      - path: DoddyApp
      - path: Shared
    dependencies:
      - target: DoddyWidgets
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
    settings:
      base:
        # Development identifier only; the production identifier is an owner decision.
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: $(DODDY_PUSH_ENTITLEMENTS)
        PRODUCT_NAME: Doddy
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Candidate icon (owner request 2026-10-09, DECISIONS.md ADR-050); light + dark variants.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only these permissions. Each is asked for only when the user turns the matching toggle on in Settings, Connections.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Doddy listens only while you are talking to him, after you tap Talk to Doddy. Your voice is sent to ElevenLabs to run the conversation."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Doddy reads your events for the days you ask about, and adds an event only after you tap Add. Turn this off in Settings, Connections."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Doddy adds a reminder only after you tap Add. Turn this off in Settings, Connections."
        # Place reminders only (ADR-194): "While Using", never "Always"; iOS watches the place itself.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Doddy uses your location only for reminders you set at a place: to find where you are when you tap Use where I am now, and so iOS can remind you when you arrive or leave. Doddy doesn't track where you go."
        INFOPLIST_KEY_NSContactsUsageDescription: "Doddy looks up a contact by name when you ask. The details stay on your screen. Turn this off in Settings, Connections."
        # Background audio + Live Activities for the conversation's Dynamic Island (ADR-053).
        INFOPLIST_FILE: Config/Doddy-Info.plist
  DoddyWidgets:
    # Widget extension: the voice conversation's Live Activity (Dynamic Island and Lock Screen)
    # and, on iOS 18+, the "Talk to Doddy" control (Control Center, Lock Screen, Action Button).
    # No networking, no data of its own.
    type: app-extension
    platform: iOS
    sources:
      - path: DoddyWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).widgets
        PRODUCT_NAME: DoddyWidgets
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DoddyWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        SKIP_INSTALL: YES
        # Shared/ intents check this to skip app-only code (TalkToDoddyIntent runs in the app).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DODDY_WIDGET_EXTENSION"
  DoddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoddyTests
    dependencies:
      - target: Doddy
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  DoddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DoddyUITests
    dependencies:
      - target: Doddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      targets:
        - DoddyTests
        - DoddyUITests
