# XcodeGen spec for the Doddy iPhone app (https://github.com/yonaskolb/XcodeGen).
# `Doddy.xcodeproj` is GENERATED from this file and is intentionally not committed:
# no Xcode was available to open or build a generated project when M0 was authored.
# Generate on a Mac with:  make project      (needs `brew install xcodegen`)
name: Doddy
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  DoddyCore:
    path: Packages/DoddyCore
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    exactVersion: 3.3.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # No signing team is committed. Select your own team in Xcode to run on a device.
    DEVELOPMENT_TEAM: ""
targets:
  Doddy:
    type: application
    platform: iOS
    sources:
      - path: DoddyApp
      - path: DoddyShared
    dependencies:
      - target: DoddyWidgets
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
    settings:
      base:
        # Development identifier only; the production identifier is an owner decision.
        PRODUCT_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev
        PRODUCT_NAME: Doddy
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # No app icon until the owner approves one (DECISIONS.md ADR-023); XcodeGen would
        # otherwise require an "AppIcon" set and the asset catalog build fails.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only the microphone, for voice conversations the user starts. No other permission keys.
        # Live Activities (Dynamic Island) and the audio background mode that lets an already-open
        # conversation continue while another app is in front. The app ends the conversation when
        # the Dynamic Island is not showing (VoiceView), so the microphone is never open unseen.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Doddy listens only while you are talking to him, after you tap Talk to Doddy. Your voice is sent to ElevenLabs to run the conversation."
  DoddyWidgets:
    # Widget extension that draws the Live Activity (Dynamic Island + Lock Screen).
    type: app-extension
    platform: iOS
    sources:
      - path: DoddyWidgets
      - path: DoddyShared
    info:
      path: DoddyWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        # Must match the app or iOS rejects the embedded extension.
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
  DoddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoddyTests
    dependencies:
      - target: Doddy
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  DoddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DoddyUITests
    dependencies:
      - target: Doddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      targets:
        - DoddyTests
        - DoddyUITests
