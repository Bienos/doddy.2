# XcodeGen spec for the Doddy iPhone app (https://github.com/yonaskolb/XcodeGen).
# `Doddy.xcodeproj` is GENERATED from this file and is intentionally not committed:
# no Xcode was available to open or build a generated project when M0 was authored.
# Generate on a Mac with:  make project      (needs `brew install xcodegen`)
# One project per platform (docs/platforms/README.md):
#   project.yml         iPhone + iPad app, its extensions, and the Apple Watch app embedded in it
#                       (what ships; schemes Doddy and DoddyWatch)        -> Doddy.xcodeproj
#   project-iphone.yml  the same without the Watch app, for iPhone/iPad work -> DoddyiPhone.xcodeproj
#   project-mac.yml     the Mac menu bar app and its widget, nothing else    -> DoddyMac.xcodeproj
name: Doddy
options:
  # Marks the generated project as already checked against this Xcode, so Xcode stops offering
  # "Update to recommended settings". Accepting that offer would change the generated project only
  # (the next `make project` undoes it) and can turn on settings the specs keep off, such as the
  # generated string symbols project-iphone.yml turns off. Raise it after moving to a newer Xcode.
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  DoddyCore:
    path: Packages/DoddyCore
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    exactVersion: 3.3.1
  # Already pulled in by ElevenLabs; listed so the app can set the call's audio session (ADR-207).
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # No signing team is committed. Select your own team in Xcode to run on a device.
    DEVELOPMENT_TEAM: ""
    # Override this at build time for an isolated simulator install; keep the owner's default.
    DODDY_APP_BUNDLE_IDENTIFIER: com.bienos.doddy2.dev
    # Push notifications from the Doddy messaging server (ADR-142, ADR-174). Off by default. Now that
    # the App Group is on (below), turn push on with DODDY_APP_ENTITLEMENTS =
    # Config/Doddy-Push-AppGroup.entitlements (push and the App Group together). This variable is
    # kept for older xcodebuild lines and is no longer used by any target.
    DODDY_PUSH_ENTITLEMENTS: ""
    # The App Group `group.$(DODDY_APP_BUNDLE_IDENTIFIER)` is ON (owner, 2026-10-11: paid Apple
    # Developer account). It is the shared folder the widgets (ADR-219), "Save to Doddy" in the
    # Share Sheet (ADR-311) and the parking widget (ADR-315) need. Choose the team in Xcode;
    # automatic signing registers the group. With push as well, set DODDY_APP_ENTITLEMENTS to
    # Config/Doddy-Push-AppGroup.entitlements. To build without the App Group (e.g. a free Apple
    # ID), set these four to "": the widgets then say "Open Doddy to set up widgets" and the
    # share extension says sharing isn't set up.
    DODDY_APP_ENTITLEMENTS: Config/Doddy-AppGroup.entitlements
    DODDY_WIDGET_ENTITLEMENTS: Config/DoddyWidgets.entitlements
    DODDY_SHARE_ENTITLEMENTS: Config/DoddyShare.entitlements
    # Watch complications (ADR-262) read the snapshot from the watch's App Group (used by the
    # watch app and its widget extension).
    DODDY_WATCH_ENTITLEMENTS: Config/DoddyWatch.entitlements
    # Shared lists through iCloud (ADR-263), off by default (needs a paid team with iCloud). To
    # turn on: DODDY_CLOUD_CONTAINER = iCloud.$(DODDY_APP_BUNDLE_IDENTIFIER), and
    # DODDY_APP_ENTITLEMENTS = Config/Doddy-AppGroup-iCloud.entitlements (or
    # Config/Doddy-Push-AppGroup-iCloud.entitlements with push). Create the container in the
    # developer account first. Empty: Doddy never touches CloudKit and offers no sharing.
    DODDY_CLOUD_CONTAINER: ""
targets:
  Doddy:
    type: application
    platform: iOS
    sources:
      - path: DoddyApp
        # Agent notes for this folder, not app content.
        excludes: ["CLAUDE.md"]
      - path: Shared
      # Doddy's voice spec, read by the OpenAI voice (ADR-265, ADR-442). The same files the live
      # ElevenLabs agent is synced from, so both providers get the same prompt and tools.
      - path: voice-agent/instructions.md
        buildPhase: resources
      - path: voice-agent/tools.json
        buildPhase: resources
      - path: voice-agent/session.json
        buildPhase: resources
    dependencies:
      - target: DoddyWidgets
      # "Save to Doddy" in the Share Sheet (ADR-311).
      - target: DoddyShare
      # The Apple Watch app (ADR-232), embedded in the iPhone app.
      - target: DoddyWatch
      - package: DoddyCore
        product: DoddyCore
      - package: DoddyCore
        product: DoddyDesignTokens
      - package: DoddyCore
        product: DoddyPersistence
      - package: ElevenLabs
      - package: LiveKit
    settings:
      base:
        # Development identifier only; the production identifier is an owner decision.
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: $(DODDY_APP_ENTITLEMENTS)
        PRODUCT_NAME: Doddy
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Candidate icon (owner request 2026-10-09, DECISIONS.md ADR-050); light + dark variants.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # One Doddy window at a time (ADR-436): the scene manifest is written out in
        # Config/Doddy-Info.plist with multiple scenes off, so it is not generated here.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad (ADR-337): every orientation, so Doddy works in Split View and Slide Over.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Only these permissions. Each is asked for only when the user turns the matching toggle on in Settings, Connections.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "To hear you, Doddy needs the microphone. Doddy listens while you are talking to him: after you tap Talk to Doddy, or as soon as you open Doddy if you turned that on in Settings. Your voice in a conversation is sent to ElevenLabs to run it, or to OpenAI if you switch Home's voice to OpenAI. A voice memo you record on a note stays on this iPhone."
        # Voice memos only (ADR-230): on-device recognition is required, so the audio isn't sent.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Doddy writes out a voice memo on this iPhone when you record one, so you can check its words before saving. The recording and its words are not sent anywhere."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Doddy reads your events for the days you ask about, and adds, changes or deletes an event only after you tap Add, Change or Delete. Turn this off in Settings, Connections."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Doddy adds, changes, completes or deletes a reminder only after you tap Add, Change, Mark done or Delete. Turn this off in Settings, Connections."
        # Place reminders only (ADR-196): "While Using", never "Always"; iOS watches the place itself.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Doddy uses your location only when you ask: for reminders you set at a place (to find where you are when you tap Use where I am now, and so iOS can remind you when you arrive or leave), to save where you parked, and to work out with Apple Maps when to leave for somewhere. Doddy doesn't keep it or track where you go."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Doddy uses Face ID to open the app or a private note when you turn the lock on. iOS checks your face; Doddy only learns whether it matched."
        INFOPLIST_KEY_NSContactsUsageDescription: "Doddy looks up a contact by name, or whose birthday is coming up, when you ask, and reads birthdays for the people you pick to be reminded of. In a voice conversation, the names it finds and their birthday's day and month go to ElevenLabs, which runs Doddy's voice; numbers, email addresses and birth years stay on this iPhone. Turn this off in Settings, Connections."
        # Steps only (ADR-568): Motion & Fitness, read for one day when asked. Not Health.
        INFOPLIST_KEY_NSMotionUsageDescription: "Doddy reads your steps, walking distance and floors climbed from Motion & Fitness only when you ask, for one day of the last seven. In a voice conversation those numbers go to ElevenLabs, which runs Doddy's voice, or to OpenAI if you switch Home's voice to it. Doddy keeps none of them and reads nothing from Health. Turn this off in Settings, Connections."
        # Photos and camera (ADR-569): library counts for days asked about; the camera on a tap. No library writes.
        INFOPLIST_KEY_NSCameraUsageDescription: "Doddy opens the camera only when you tap Take a photo or Open camera. The photo you keep goes into a note on this iPhone and its text is read here; it is never sent anywhere or saved to your photo library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Doddy counts the photos and videos you took on the days you ask about and shows them on your screen. Only how many there are and when they were taken go to Doddy's voice in that conversation (ElevenLabs, or OpenAI if you switch Home's voice to it); the pictures never leave this iPhone. Doddy never changes your library. Turn this off in Settings, Connections."
        # Background audio + Live Activities for the conversation's Dynamic Island (ADR-053).
        INFOPLIST_FILE: Config/Doddy-Info.plist
  DoddyWidgets:
    # Widget extension: the voice conversation's Live Activity (Dynamic Island and Lock Screen),
    # on iOS 18+ the "Talk to Doddy" and "New note" controls, and the Home and Lock Screen widgets
    # (ADR-219), which only read the App Group snapshot the app writes. No networking, no database.
    type: app-extension
    platform: iOS
    sources:
      - path: DoddyWidgets
      - path: Shared
    dependencies:
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: $(DODDY_WIDGET_ENTITLEMENTS)
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).widgets
        PRODUCT_NAME: DoddyWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DoddyWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        SKIP_INSTALL: YES
        # Shared/ intents check this to skip app-only code (TalkToDoddyIntent runs in the app).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DODDY_WIDGET_EXTENSION"
  DoddyShare:
    # Share extension (ADR-311): "Save to Doddy" in the Share Sheet. Shows the shared text or web
    # link and, after Send to Doddy, leaves it in the App Group; the app opens the capture screen
    # with it. No networking, no database, saves no note.
    type: app-extension
    platform: iOS
    sources:
      - path: DoddyShare
      - path: Shared/Share
    dependencies:
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: $(DODDY_SHARE_ENTITLEMENTS)
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).share
        PRODUCT_NAME: DoddyShare
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DoddyShare-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Save to Doddy
        SKIP_INSTALL: YES
  DoddyWatch:
    # Apple Watch app (ADR-232): shows the snapshot the iPhone sends (pinned notes, next note
    # reminders, lists) and asks the iPhone to tick an item or save a note. No database, no
    # networking; WatchConnectivity only. Needs the iPhone app; not usable on its own.
    type: application
    platform: watchOS
    sources:
      - path: DoddyWatch
        # Agent notes for this folder, not app content.
        excludes: ["CLAUDE.md"]
      - path: Shared/Widgets/WidgetSnapshotFile.swift
    dependencies:
      # Watch face complications and the Smart Stack (ADR-262), embedded in the watch app.
      - target: DoddyWatchWidgets
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).watchkitapp
        CODE_SIGN_ENTITLEMENTS: $(DODDY_WATCH_ENTITLEMENTS)
        # The watch app's icon is the iPhone's candidate icon, byte-identical (ADR-050, ADR-336):
        # DoddyWatch/Assets.xcassets/AppIcon. It changes with the iPhone's when the owner decides.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/DoddyWatch-Info.plist
        PRODUCT_NAME: DoddyWatch
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(DODDY_APP_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        # A single-target watchOS app (watchOS 7+), not a WatchKit extension.
        INFOPLIST_KEY_WKApplication: YES
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  DoddyWatchWidgets:
    # Watch face complications and the Smart Stack (ADR-262). Reads only the snapshot the watch
    # app saves in the watch's App Group; shows times, counts and list names, never note words.
    type: app-extension
    platform: watchOS
    sources:
      - path: DoddyWatchWidgets
        # Agent notes for this folder, not app content.
        excludes: ["CLAUDE.md"]
      - path: Shared/Widgets/WidgetSnapshotFile.swift
    dependencies:
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: $(DODDY_WATCH_ENTITLEMENTS)
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).watchkitapp.widgets
        PRODUCT_NAME: DoddyWatchWidgets
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/DoddyWatchWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Doddy
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  DoddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoddyTests
    dependencies:
      - target: Doddy
      - package: DoddyCore
        product: DoddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  DoddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DoddyUITests
    dependencies:
      - target: Doddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DODDY_APP_BUNDLE_IDENTIFIER).uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Doddy:
    build:
      targets:
        Doddy: all
    test:
      targets:
        - DoddyTests
        - DoddyUITests
  # The Apple Watch app on its own (no iPhone app build), for quick watch-only compiles.
  # It still needs the iPhone app to run: it only shows what the iPhone sends (ADR-232).
  DoddyWatch:
    build:
      targets:
        DoddyWatch: all
