<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Doddy App Store v5 (PDF)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="story.css">
<style>
  /* The PDF version: A4 landscape pages built from the same scene data as index.html. */
  @page { size: 297mm 210mm; margin: 0; }
  html, body { margin: 0; background: var(--paper); }
  .pg { position: relative; width: 1123px; height: 794px; overflow: hidden; background: var(--paper); page-break-after: always; break-after: page;
    padding: 34px 44px 30px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
  .pg:last-child { page-break-after: auto; break-after: auto; }
  .pg-top { display: flex; align-items: center; gap: 14px; }
  .pg-top img { height: 30px; }
  .pg-top .crumb { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pg-top .flag { font-size: 11px; padding: 5px 10px; }
  .pg-foot { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); letter-spacing: .02em; }
  .pg h1 { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: .95; letter-spacing: -0.035em; margin: 0; text-wrap: balance; }
  .pg h1 em { font-style: normal; background: linear-gradient(transparent 64%, var(--orange) 64%, var(--orange) 86%, transparent 86%); }
  .pg h2 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.03em; margin: 0; }
  .lead { font-size: 15px; line-height: 1.5; margin: 0; max-width: 34em; }
  .small { font-size: 12px; color: var(--muted); margin: 0; max-width: 46em; }

  .cover { display: grid; grid-template-columns: 1.05fr 1fr; gap: 30px; align-items: center; }
  .cover .left { display: grid; gap: 18px; }
  .fan2 { position: relative; height: 560px; }
  .fan2 img { position: absolute; top: 40px; left: 50%; width: 190px; border-radius: 14px; transform-origin: 50% 120%; box-shadow: 0 18px 30px -16px rgba(70,45,15,.5); }
  .fan2 .dd { position: absolute; left: 0; bottom: -10px; width: 110px; box-shadow: none; border-radius: 0; transform: none; top: auto; }

  .trio3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; align-items: start; }
  .col { display: grid; grid-template-columns: 158px minmax(0, 1fr); gap: 14px; align-items: start; }
  .col img.sh { width: 158px; border-radius: 12px; box-shadow: 0 12px 24px -14px rgba(70,45,15,.5); }
  .col .meta { display: grid; gap: 7px; min-width: 0; }
  .col .num { font-family: var(--display); font-weight: 700; font-size: 12px; background: var(--ink); color: var(--paper); border-radius: 99px; padding: 2px 9px; justify-self: start; }
  .col .bt { display: grid; gap: 1px; }
  .col .bt b { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .col .bt span { font-size: 11.5px; line-height: 1.35; }
  .col .bt q { font-family: var(--display); font-weight: 600; font-size: 12.5px; quotes: "„" "”"; }
  .col .pf { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .col .pf .pill { font-size: 8.5px; padding: 2px 6px; }
  .note-row { font-size: 11px; color: var(--muted); margin: 0; }

  .heads6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 22px; }
  .hcol { display: grid; gap: 5px; align-content: start; }
  .hcol h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hcol .h { font-size: 11px; line-height: 1.3; padding: 5px 0 5px; border-bottom: 1px dashed var(--line); }
  .hcol .h b { display: block; font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--ink); }
  .hcol .h.pick b::after { content: "wybrany"; margin-left: 6px; font-family: var(--body); font-size: 8.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--orange); border-radius: 99px; padding: 1px 6px; vertical-align: 2px; }
  .hcol .h span { color: var(--muted); }

  .simrow { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 34px; align-items: start; }
  .simrow .txt { display: grid; gap: 12px; align-content: start; font-size: 12.5px; line-height: 1.45; }
  .simrow .txt h3 { margin: 0; font-family: var(--display); font-size: 18px; }
  .simrow .txt p { margin: 0; }
  .order { margin-top: 0; font-size: 12px; }
  .order .o { width: 26px; height: 26px; font-size: 13px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .box { border: 1.5px solid var(--ink); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
  .box h3 { margin: 0; font-family: var(--display); font-size: 16px; }
  .box ul { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 10.8px; line-height: 1.38; }
  .box code { font-size: 9.5px; background: var(--quiet); padding: 0 4px; border-radius: 4px; }
  .gaps { font-size: 10px; }
  .gaps th, .gaps td { padding: 4px 6px; }
  .gaps th { font-size: 9px; }
</style>
</head>
<body>
<div id="deck"></div>
<script src="story.js"></script>
<script>
(function () {
  const S = window.DoddyStory.SCENES;
  const top = '<div class="pg-top"><img src="assets/wordmark.svg" alt="Doddy"><span class="crumb">App Store · kierunek 05</span><span class="flag">Rekonstrukcje i przykładowe rozmowy</span></div>';
  const foot = n => '<div class="pg-foot"><span>Ekrany telefonu to rekonstrukcje z kodu i zrzutów z CI (symulator, 2 listopada 2026). Rozmowy są przykładowe. Przed publikacją zastąp je autentycznymi ujęciami sprawdzonych funkcji.</span><span>' + n + ' / 6</span></div>';
  const pillName = { ci: "zrzut z CI", code: "w kodzie", no: "niesprawdzone", ex: "przykład" };
  const col = sc => '<div class="col"><img class="sh" src="shots/web/' + sc.id + '.jpg" alt=""><div class="meta"><span class="num">' + sc.no + '</span>' +
    sc.beats.map(b => '<div class="bt"><b>' + b.k + '</b><span>' + b.v + '</span></div>').join("") +
    '<div class="pf">' + sc.proof.map(p => '<span class="pill ' + p[0] + '">' + pillName[p[0]] + '</span>').join("") + '</div></div></div>';

  let h = "";
  // 1. cover
  h += '<section class="pg">' + top + '<div class="cover"><div class="left"><p class="eyebrow" style="margin:0">Prezentacja w App Store · 8 listopada 2026</p>' +
    '<h1>Sześć zwykłych chwil i&nbsp;<em>jedno zdanie</em> do Doddy’ego.</h1>' +
    '<p class="lead">Każda plansza pokazuje sytuację z życia, zdanie, które można powiedzieć, to, czego dotknąć, i wynik widoczny w aplikacji.</p>' +
    '<p class="small">Projektujemy dla osoby, która ma dużo drobnych spraw, czasem zajęte ręce i potrzebuje pomocy w konkretnym momencie. To hipotezy do sprawdzenia, nie wynik badania. Animowana wersja z rozpisanymi scenami: <b>index.html</b> w tym samym folderze.</p></div>' +
    '<div class="fan2">' + ["s6", "s5", "s4", "s3", "s2", "s1"].map((id, i) => '<img src="shots/web/' + id + '.jpg" alt="" style="transform:translateX(-50%) rotate(' + (-21 + i * 8.2).toFixed(1) + 'deg) translateY(' + [30, 10, 0, 0, 10, 30][i] + 'px)">').join("") +
    '<img class="dd" src="assets/wave-5.png" alt=""></div></div>' + foot(1) + '</section>';
  // 2–3. boards
  [[0, 1, 2], [3, 4, 5]].forEach((g, k) => {
    h += '<section class="pg">' + top + '<div style="display:grid;gap:16px;align-content:start"><h2>' + (k ? "Plansze 4–6" : "Plansze 1–3") + ': sytuacja, start, zdanie, wynik</h2><div class="trio3">' + g.map(i => col(S[i])).join("") + '</div>' +
      '<p class="note-row">Etykiety: <span class="pill ci">zrzut z CI</span> wygląd widziany na zrzucie z symulatora · <span class="pill code">w kodzie</span> zbudowane, bez zrzutu · <span class="pill no">niesprawdzone</span> nie sprawdzone na urządzeniu w żadnym zapisanym teście · <span class="pill ex">przykład</span> treść przykładowa.</p></div>' + foot(2 + k) + '</section>';
  });
  // 4. headlines
  h += '<section class="pg">' + top + '<div style="display:grid;gap:16px;align-content:start"><h2>Pięć nagłówków na scenę, jeden wybrany</h2><p class="small" style="margin-top:-8px">Kryteria: konkretny, naturalny, czytelny w małym podglądzie, 3–7 słów; odrzucone hasła pasujące do każdego asystenta, techniczny żargon i obietnice bez dowodu.</p><div class="heads6">' +
    S.map(sc => '<div class="hcol"><h3>' + sc.no + ' · ' + sc.name + '</h3>' + sc.heads.map(x => '<div class="h' + (x.pick ? " pick" : "") + '"><b>' + x.t + '</b><span>' + x.why + '</span></div>').join("") + '</div>').join("") +
    '</div></div>' + foot(4) + '</section>';
  // 5. store simulation
  const phone = (inner) => '<div class="phone-wrap" style="--s:.6"><div class="phone"><span class="side ab"></span><span class="side v1"></span><span class="side v2"></span><span class="side pw"></span><div class="screen"><div class="hw-island"></div><div class="as">' + inner + '</div></div></div></div>';
  const sbx = '<div class="sb"><span>9:41</span><span class="sb-r"></span></div>';
  const order = ["s1", "s3", "s4", "s5", "s6", "s2"];
  const product = sbx + '<span class="back">‹ Szukaj</span><div class="hdr"><img src="assets/app-icon.png" alt=""><div><div class="nm">Doddy</div><div class="st">Postać AI do drobnych spraw</div><span class="get">Pobierz</span></div></div>' +
    '<div class="info"><div><small>Oceny</small><b>Brak</b></div><div><small>Wiek</small><b>—</b></div><div><small>Język</small><b>PL</b></div></div><div class="pv">Podgląd</div><div class="car">' +
    order.map(id => '<div class="shot-scale" style="--k:.5"><img src="shots/web/' + id + '.jpg" alt=""></div>').join("") + '</div>';
  const search = sbx + '<div class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg> doddy</div><div class="row"><img src="assets/app-icon.png" alt=""><div><div class="nm">Doddy</div><div class="st">Postać AI do drobnych spraw</div></div><span class="get">Pobierz</span></div><div class="trio">' +
    order.slice(0, 3).map(id => '<div class="shot-scale"><img src="shots/web/' + id + '.jpg" alt=""></div>').join("") + '</div><div class="more"><div></div><div></div><div></div></div>';
  h += '<section class="pg">' + top + '<div style="display:grid;gap:14px;align-content:start"><h2>Symulacja App Store</h2><div class="simrow">' + phone(product) + phone(search) +
    '<div class="txt"><h3>Strona aplikacji i wyniki wyszukiwania</h3><p>Uproszczona symulacja, nie strona Apple. W wynikach wyszukiwania widać tylko trzy pierwsze plansze, po około 115 punktów szerokości; litery nagłówka mają tam około 12 pt.</p>' +
    '<div class="order"><span>Kolejność:</span><span class="o">1</span><span class="o">3</span><span class="o">4</span><span class="o">5</span><span class="o">6</span><span class="o late">2</span></div>' +
    '<p>Plansza 2 dołącza po sprawdzeniu przycisku czynności na telefonie. Tłumacz z planszy 4 jest w wersji beta od 8 listopada (decyzja 2026-11-08-translator-in-beta).</p>' +
    '<p><b>Podtytuł:</b> „Postać AI do drobnych spraw”: mówi, czym Doddy jest i do czego.</p>' +
    '<p><b>Opis, pierwsze zdania:</b> „Doddy to postać AI na iPhonie. Stuknij go i powiedz, co masz na głowie, albo napisz w Wiadomościach. Zanim cokolwiek zapisze albo doda do przypomnień, pokaże dokładną treść i poczeka, aż stukniesz.”</p></div></div></div>' + foot(5) + '</section>';
  // 6. before publishing
  h += '<section class="pg">' + top + '<div style="display:grid;gap:12px;align-content:start"><h2>Przed publikacją</h2><div class="grid2">' +
    '<div class="box"><h3>Zastąp rekonstrukcje</h3><ul><li>Zbuduj <code>main</code> na telefonie: konto głosowe, „Zapytaj Doddy’ego” włączone, język polski.</li><li>Przejdź każdą scenę naprawdę i zrób zrzut w chwili wyniku; podmień tylko telefon.</li><li>Etykietę „Rekonstrukcja” zdejmij dopiero z planszy z autentycznym ujęciem.</li><li>Format 1290 × 2796 albo 1320 × 2868.</li></ul></div>' +
    '<div class="box"><h3>Sprawdź na urządzeniu</h3><ul><li><b>1</b> rozmowa po stuknięciu i „Zapis rozmowy”. <b>2</b> macierz z <code>ACTION_BUTTON_ISLAND.md</code> (co najmniej 1, 2, 4, 5, 13, 16) i „Pokaż”.</li><li><b>3</b> „Zapamiętaj: …” daje kartę notatki; pytanie w Wiadomościach pokazuje notatkę. <b>4</b> PL ⇄ ES twarzą w twarz.</li><li><b>5</b> zdjęcie prawdziwej karty, trafność na kilkunastu kartach. <b>6</b> dyktowanie i sensowność odpowiedzi.</li><li><b>4</b> tłumacz twarzą w twarz PL ⇄ ES na telefonie.</li></ul></div>' +
    '<div class="box"><h3>Polskie tłumaczenia: poprawione 8 listopada</h3><ul><li>Dodane: wstęp pustej rozmowy w Wiadomościach, pasek tłumacza („Słucham”, „Wstrzymane”), „Doddy powiedział do nich”, „Mówią”, przewodnik przycisku czynności i 150 innych napisów.</li><li>Jeszcze nieskompilowane w aplikacji i niewidziane na telefonie.</li><li>Zostają po angielsku: napisy z wartością w środku (np. „\\(count) to go”), osobne zadanie.</li></ul></div>' +
    '<div class="box"><h3>Czego nie twierdzimy · jak mierzyć</h3><ul><li>Nie piszemy, że funkcje działają na każdym iPhonie ani bezbłędnie; obecność kodu tego nie dowodzi.</li><li>Nie twierdzimy, że seria poprawi konwersję.</li><li>Przed publikacją: test pięciu sekund, test pierwszego kliknięcia, test preferencji nagłówków (5–8 osób).</li><li>Po publikacji: Product Page Optimization w App Store Connect, v4 kontra v5.</li></ul></div>' +
    '</div></div>' + foot(6) + '</section>';
  document.getElementById("deck").innerHTML = h;
})();
</script>
</body>
</html>
