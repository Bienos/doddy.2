# Render Blueprint for two Doddy services:
#  - doddy: the backend (backend/): web search through Monid, and Gmail/Drive/Notion/Todoist/Calendar
#    through Composio. Either half is optional in live mode; at least one must be set (ADR-193).
#  - doddy-messaging (+ worker + Postgres): notifications, texts, phone calls and the daily news
#    (server/messaging/, ADR-139). Paid plans: confirm cost before applying. Owner decision
#    2026-10-10: one Render setup; the backend is expected to move onto the same Postgres later.
# Deploy: Render dashboard > New > Blueprint > pick this repo and branch. Render asks for every
# variable marked `sync: false`, only when the Blueprint is first created, and keeps them on later
# syncs. The messaging secrets sit on both doddy-messaging and its worker, so Render asks for them
# twice (ADR-495: an environment group can't hold `sync: false` keys; Render ignores them there).
# Secrets come from 1Password (ADR-493, docs/security/SECRETS_1PASSWORD.md); never type them in
# chat or in this file.
# Status (18 Oct 2026): this Blueprint has not been applied. The services running on Render were made
# by hand: doddy, doddy-messaging (a free web service, no separate worker), and copies of
# doddy-voice-token and doddy-gateway. See docs/integrations/DEPLOY_RENDER.md and
# docs/implementation/S1_SERVER_STATUS.md.
services:
  - type: web
    name: doddy
    runtime: node
    plan: free            # sleeps when idle and has no disk: data lives in Postgres (DATABASE_URL, ADR-525)
    region: frankfurt     # closest to Warsaw
    rootDir: backend
    # Also builds Doddy Web (web/, ADR-585), which this service serves on its own origin. The live
    # service was made by hand: its build command has to be changed the same way in the dashboard.
    buildCommand: npm ci && npm run build && npm ci --prefix ../web && npm run build --prefix ../web
    startCommand: node dist/src/server.js
    healthCheckPath: /v1/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"       # package.json needs >= 22.22.3 (@composio/core)
      - key: DODDY_MODE
        value: live
      # production + live is refused by the server until real app sign-in exists.
      - key: DODDY_ENV
        value: development
      - key: DODDY_HOST
        value: 0.0.0.0
      - key: DODDY_PORT
        value: "10000"    # Render's default PORT
      # signed = the owner's minted token; supabase = Apple or Google sign-in (ADR-526), plus the
      # owner's token in development while DODDY_SESSION_SIGNING_KEY is set.
      - key: DODDY_AUTH_MODE
        value: signed
      - key: SUPABASE_URL
        sync: false
      - key: DODDY_SESSION_SIGNING_KEY
        generateValue: true
      # Hosted Postgres (ADR-525): postgres://… URL, and the CA's PEM when it isn't a public one
      # (Supabase: its root CA). Without DATABASE_URL the server uses PGlite at DODDY_DB_PATH, which
      # the free plan loses on every restart.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      # callback = single-owner development only (the server refuses it in production).
      - key: COMPOSIO_COMPLETION_MODE
        value: callback
      # https origin, no path: https://doddy.onrender.com or the URL Render shows if that name is taken.
      - key: DODDY_PUBLIC_BASE_URL
        sync: false
      # Composio is optional: leave all three empty for a web-search-only server (accounts show
      # "Not set up"); fill all three to turn the accounts on.
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_GOOGLECALENDAR_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_GOOGLECALENDAR_TOOLKIT_VERSION
        sync: false
      # Online accounts: both values or neither (neither = "Not set up" in the app).
      - key: COMPOSIO_GMAIL_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_GMAIL_TOOLKIT_VERSION
        sync: false
      - key: COMPOSIO_GOOGLEDRIVE_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_GOOGLEDRIVE_TOOLKIT_VERSION
        sync: false
      - key: COMPOSIO_NOTION_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_NOTION_TOOLKIT_VERSION
        sync: false
      - key: COMPOSIO_TODOIST_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_TODOIST_TOOLKIT_VERSION
        sync: false
      - key: COMPOSIO_OUTLOOK_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_OUTLOOK_TOOLKIT_VERSION
        sync: false
      # Google Calendar as an online account (ADR-486); events only.
      - key: COMPOSIO_GCALENDAR_AUTH_CONFIG_ID
        sync: false
      - key: COMPOSIO_GCALENDAR_TOOLKIT_VERSION
        sync: false
      # Web search through Monid (optional; empty = "not set up"). Paid from Doddy's Monid wallet.
      - key: MONID_API_KEY
        sync: false
      # ADR-563: the phone signs itself in with a device ID. open (ADR-587, owner 22 Oct: Ask Doddy
      # for everyone) = the first iPhone that signs in owns this server; every other iPhone gets a
      # guest session good for Ask Doddy only (never the owner's accounts, search or documents).
      # first-device = others are refused. Development only; needs DODDY_SESSION_SIGNING_KEY.
      # The live service is hand-made: set the same value there (Environment).
      - key: DODDY_DEVICE_SIGNUP
        value: open
      # Optional, comma-separated: codes that let a further device in (8-64 letters, digits, - or _).
      - key: DODDY_DEVICE_INVITE_CODES
        sync: false
      # ADR-564: Claude for summaries, writing and documents (decks, Word, Excel, PDF, blog posts).
      # Empty = those tools say "not set up". Doddy's own key; paid per use, with daily caps.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DODDY_CLAUDE_MODEL
        value: claude-sonnet-5-5
      # ADR-587: Ask Doddy questions per user and for the whole server per UTC day (Doddy pays).
      - key: DODDY_LIMIT_USER_DAILY_ASK
        value: "50"
      - key: DODDY_LIMIT_SERVICE_DAILY_ASK
        value: "500"
      # Doddy Web (ADR-585): the https origin people open it at, e.g. this service's own
      # https://doddy-yaci.onrender.com, or https://app.doddy.lol once the owner points that name
      # here. Empty: the web app and its routes are off.
      - key: DODDY_WEB_ORIGIN
        sync: false
      # Render's proxy appends the client's address to X-Forwarded-For; used only for per-client
      # limits (wrong web sign-in codes, new guest iPhones).
      - key: DODDY_TRUST_PROXY
        value: "1"

  - type: web
    name: doddy-messaging
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server/messaging
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: doddy-db
          property: connectionString
      # Secrets: service-level `sync: false`, because Render asks for these when the Blueprint is
      # first created and keeps them on later syncs. An environment group can't do that (ADR-495).
      # The same keys are on doddy-messaging-worker; tools/secrets/sync.mjs can fill both from 1Password.
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Phone calls (S2)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MEMORY_ENCRYPTION_KEY
        sync: false
      - key: ELEVENLABS_TOOL_SECRET
        sync: false
      - key: ELEVENLABS_PHONE_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: DODDY_PHONE_NUMBER
        sync: false
      # Calls Doddy makes for the user (ADR-500, docs/decisions/calls.md). Use a Poland-only
      # Twilio subaccount; the TWILIO_TASK_* pair falls back to TWILIO_ACCOUNT_SID/AUTH_TOKEN.
      - key: TWILIO_TASK_ACCOUNT_SID
        sync: false
      - key: TWILIO_TASK_AUTH_TOKEN
        sync: false
      - key: TASK_CALL_FROM_NUMBER
        sync: false
      - key: ELEVENLABS_TASK_AGENT_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: TASK_CALLS_KILL_SWITCH # "1" stops every call by Doddy at once
        value: "0"
      - key: CALL_RECORDING_NOTICE # off until the owner confirms the legal basis
        value: "off"
      - key: PRICE_TWILIO_TRANSCRIPTION_USD_PER_MIN
        sync: false
      - key: PRICE_TWILIO_CONFERENCE_USD_PER_PARTICIPANT_MIN
        sync: false
      - key: PRICE_ELEVENLABS_USD_PER_CREDIT
        sync: false
      # Daily news (N1); ANTHROPIC_API_KEY also writes the call answer card's summary and runs
      # errands (ADR-570)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ERRANDS_ENABLED # "0" (the default) refuses new errands and starts no queued one; "1" turns them on
        value: "0"
      - key: OPENAI_API_KEY # used only when ANTHROPIC_API_KEY is empty (ADR-197)
        sync: false
      - key: GNEWS_API_KEY
        sync: false

  - type: worker
    name: doddy-messaging-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server/messaging
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: doddy-db
          property: connectionString
      # Secrets: service-level `sync: false`, because Render asks for these when the Blueprint is
      # first created and keeps them on later syncs. An environment group can't do that (ADR-495).
      # The same keys as doddy-messaging; tools/secrets/sync.mjs can fill both from 1Password.
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Phone calls (S2)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MEMORY_ENCRYPTION_KEY
        sync: false
      - key: ELEVENLABS_TOOL_SECRET
        sync: false
      - key: ELEVENLABS_PHONE_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: DODDY_PHONE_NUMBER
        sync: false
      # Calls Doddy makes for the user (ADR-500, docs/decisions/calls.md). Use a Poland-only
      # Twilio subaccount; the TWILIO_TASK_* pair falls back to TWILIO_ACCOUNT_SID/AUTH_TOKEN.
      - key: TWILIO_TASK_ACCOUNT_SID
        sync: false
      - key: TWILIO_TASK_AUTH_TOKEN
        sync: false
      - key: TASK_CALL_FROM_NUMBER
        sync: false
      - key: ELEVENLABS_TASK_AGENT_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: TASK_CALLS_KILL_SWITCH # "1" stops every call by Doddy at once
        value: "0"
      - key: CALL_RECORDING_NOTICE # off until the owner confirms the legal basis
        value: "off"
      - key: PRICE_TWILIO_TRANSCRIPTION_USD_PER_MIN
        sync: false
      - key: PRICE_TWILIO_CONFERENCE_USD_PER_PARTICIPANT_MIN
        sync: false
      - key: PRICE_ELEVENLABS_USD_PER_CREDIT
        sync: false
      # Daily news (N1); ANTHROPIC_API_KEY also writes the call answer card's summary and runs
      # errands (ADR-570)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ERRANDS_ENABLED # "0" (the default) refuses new errands and starts no queued one; "1" turns them on
        value: "0"
      - key: OPENAI_API_KEY # used only when ANTHROPIC_API_KEY is empty (ADR-197)
        sync: false
      - key: GNEWS_API_KEY
        sync: false

databases:
  - name: doddy-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
