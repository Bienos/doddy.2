# Render Blueprint for the Doddy server (ADR-036). EU region; secrets are entered in the
# Render dashboard (sync: false) and never committed. Plans below are paid: confirm before applying.
envVarGroups:
  - name: doddy-secrets
    envVars:
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # S2 phone calls
      - key: MEMORY_ENCRYPTION_KEY
        sync: false
      - key: ELEVENLABS_TOOL_SECRET
        sync: false
      - key: ELEVENLABS_PHONE_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: DODDY_PHONE_NUMBER
        sync: false

services:
  - type: web
    name: doddy-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: doddy-db
          property: connectionString
      - fromGroup: doddy-secrets

  - type: worker
    name: doddy-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: doddy-db
          property: connectionString
      - fromGroup: doddy-secrets

databases:
  - name: doddy-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
