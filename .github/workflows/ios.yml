# Hosted macOS build for Doddy (owner approval 2026-10-10, closes ADR-022's open choice).
# Runs the same scripts/ci.sh a contributor runs locally, split so the slow parts run side by side
# (ADR-684): the Linux groups (checks, swift, backend, node, messaging; `core` below collects them)
# and the Mac job (the Xcode build, then the unit tests and the UI tests on the first available
# iPhone simulator, restarted between the two, ADR-561).
# No signing team or secrets are used; nothing is deployed.
# Builds the iPhone/iPad app only: the Apple Watch and Mac apps are paused (ADR-572) and are in no
# target of project.yml. The "macOS" below is the runner Xcode needs, not an app being built.
# The Mac runs beside Linux and keeps #164's --app-only path (ADR-680): Swift package tests
# on Apple's Foundation, build, unit tests and UI tests. The public repository uses free hosted
# runners. Path selection only skips jobs whose inputs are known unaffected; unknown paths run all.
# Every action is pinned to a full commit SHA, with the release it was on kept as the comment (ADR-715):
# a moved tag can't change what runs here. To update one, find the commit of the new tag with
# `git ls-remote https://github.com/<owner>/<repo>.git "refs/tags/<tag>" "refs/tags/<tag>^{}"` (the
# peeled ^{} line, when there is one, is the commit) and change the SHA and the comment together.
name: iOS build and tests

on:
  # The default branch, `main` (renamed from `claude/loving-dirac-uuxoux` on 7 Nov 2026), is what
  # Render deploys and Xcode Cloud builds. Every push to it runs every job (ADR-811), so `main`'s own
  # result says the whole app and every server were built and tested at that commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "all: the full run. island: only the Dynamic Island's tests and pictures, about 15-20 minutes (ADR-618); not enough for a merge."
        type: choice
        options: [all, island]
        default: all

concurrency:
  # Pull requests: a newer push to the branch cancels the older run. Pushes to `main` (ADR-811): the
  # commit is in the group, so each one gets its own run that is never cancelled, and never replaced
  # while it waits (GitHub drops a pending run when a newer one joins the same group). Before this, a
  # docs merge right after an app merge cancelled the app merge's run (7 Nov 2026, run 42376928312).
  # The quick island run (ADR-618) has its own group, so it doesn't cancel a full run of the same branch.
  group: ios-${{ github.event_name == 'push' && github.sha || github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which jobs are needed (ADR-497, ADR-684). Cheap: a shallow checkout and a file list.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.decide.outputs.mac }}
      swift: ${{ steps.groups.outputs.swift }}
      backend: ${{ steps.groups.outputs.backend }}
      node: ${{ steps.groups.outputs.node }}
      messaging: ${{ steps.groups.outputs.messaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A pull request is checked out as its test merge commit. Its first parent is the base
          # branch, so HEAD^1..HEAD is exactly what the pull request changes.
          fetch-depth: 2

      - name: Which changed files does this pull request have?
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # An empty list makes both scripts run everything: the safe answer.
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = "push" ]; then
            # A push to `main` runs everything (ADR-811). Testing only what the push changed (ADR-675)
            # left `main` green on a docs commit whose app or servers were never tested (7 Nov 2026,
            # run 42379647254 after #195's messaging failure and #198's cancelled run).
            echo "Push to main: everything runs." >&2
          elif [ "$EVENT" != "pull_request" ]; then
            echo "Run by hand: everything runs." >&2
          elif git rev-parse --verify -q 'HEAD^2' >/dev/null \
            && git diff --name-only --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/changed.txt.new"; then
            mv "$RUNNER_TEMP/changed.txt.new" "$RUNNER_TEMP/changed.txt"
          else
            echo "Couldn't list what the pull request changes: everything runs." >&2
          fi

      - name: Does this change need the macOS build?
        id: decide
        run: scripts/ci_needs_mac.sh < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

      - name: Which Linux groups does this change need?
        id: groups
        run: scripts/ci_groups.sh < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

  # Preserve #164: Mac Swift + Xcode tests only, no repeated Linux checks.
  # Named `ios-build` (was `ci`, ADR-811) so the required check in the `main` ruleset says what it is.
  # A pull request that can't reach the app skips it, and a skipped job counts as passed.
  # Image and Xcode are pinned (ADR-811): `macos-latest` and `latest-stable` let a new runner image or
  # Xcode change CI overnight with no code change. They are what this job ran on 7 Nov 2026 (image
  # macos-26-arm64 20261102, Xcode 26.6 17F113) and match project.yml's `xcodeVersion`. Move all three
  # together, in a pull request of their own.
  ios-build:
    name: ios-build
    needs: [changes]
    if: needs.changes.outputs.mac == 'true' && inputs.only != 'island'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      # scripts/check_platform_specs.py reads the per-platform XcodeGen specs.
      - name: Install PyYAML
        # Not --user: ci.sh runs python3 -I, which ignores the user site-packages.
        run: python3 -m pip install --break-system-packages pyyaml || python3 -m pip install pyyaml

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version

      - name: scripts/ci.sh --app-only
        env:
          # Pull requests run the UI smoke classes, about 8 of the suite's 27 minutes (ADR-811);
          # pushes to main and runs by hand run every UI test. A pull request labelled
          # `full-ui-tests` runs them all too (the label is read when the run starts).
          DODDY_UI_TESTS: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ui-tests')) && 'all' || 'smoke' }}
        run: scripts/ci.sh --app-only

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Pictures of the Dynamic Island's views in each conversation state, drawn by
      # DoddyTests/IslandScreenshotTests (ADR-615). Small PNGs, so the look can be checked from here.
      - name: Keep the island pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: island-screenshots
          path: build/island-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # ---- The Linux groups (ADR-137, ADR-684). Each runs one `scripts/ci.sh --only <group>`, in
  # parallel; a group is skipped when `changes` says no changed file can reach it.

  # Python generators and guards, the agent specs, the pack check: seconds, always run.
  checks:
    if: inputs.only != 'island'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Python for the checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: scripts/ci.sh --only checks
        run: scripts/ci.sh --only checks

  # Swift package tests, the app-logic type-check and the model tests. Official Swift image, the
  # toolchain the Linux checks were run with (Swift 6.1).
  swift:
    needs: [changes]
    if: needs.changes.outputs.swift == 'true' && inputs.only != 'island'
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Cache SwiftPM's checkouts and build products (GRDB, swift-crypto and the rest compile once).
      # Our own sources get fresh timestamps on checkout and rebuild; the dependencies' don't.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/DoddyCore/.build
          key: swiftpm-6.1-${{ hashFiles('Packages/DoddyCore/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-6.1-${{ hashFiles('Packages/DoddyCore/Package.swift') }}-
            swiftpm-6.1-

      - name: SQLite headers and Python for the checks
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3 python3-yaml

      - name: Tool versions
        run: |
          swift --version
          python3 --version

      - name: scripts/ci.sh --only swift
        run: scripts/ci.sh --only swift

  # The backend's type-check and tests: the longest Linux group (about 7 minutes), so it has a job to itself.
  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' && inputs.only != 'island'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: scripts/ci.sh --only backend
        run: scripts/ci.sh --only backend

  # Gateway, web app, site functions, voice token server, the secrets tool.
  node:
    needs: [changes]
    if: needs.changes.outputs.node == 'true' && inputs.only != 'island'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            gateway/package-lock.json
            web/package-lock.json
            site/package-lock.json
      - name: Install backend dependencies for web end-to-end tests
        run: npm ci --prefix backend --no-audit --no-fund
      # The voice token server's tests run its Redis scripts (limits, sign-in throttle, refresh reuse) on a
      # real redis-server when there is one (ADR-712); without it they are skipped. If this step fails
      # the tests skip as before, so it can't turn the job red by itself.
      - name: Install redis-server for the voice token server's script tests
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends redis-server
      - name: scripts/ci.sh --only node
        run: scripts/ci.sh --only node

  # The messaging server (server/messaging, ADR-139), with a disposable Postgres for its tests.
  messaging:
    needs: [changes]
    if: needs.changes.outputs.messaging == 'true' && inputs.only != 'island'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doddy
          POSTGRES_PASSWORD: doddy
          POSTGRES_DB: doddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doddy -d doddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://doddy:doddy@localhost:5432/doddy_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/messaging/package-lock.json
      - name: scripts/ci.sh --only messaging
        run: scripts/ci.sh --only messaging

  # One result for the Linux side, named `core` as before so anything that waits for that check
  # still works. Green when every group that ran passed; a group skipped by `changes` counts as
  # fine, a failed or cancelled one does not.
  core:
    needs: [changes, checks, swift, backend, node, messaging]
    if: always() && inputs.only != 'island'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All Linux groups that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "A Linux group failed or was cancelled." >&2; exit 1 ;;
          esac

  # The quick island-only check (ADR-618), run by hand with only=island: no wait for the Linux
  # checks, one build, then only the Dynamic Island's unit and UI tests. Its pictures and the
  # simulator's screenshots are kept like the full run's. Not a substitute for the full run.
  island:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'island'
    # Pinned like ios-build (ADR-811).
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: scripts/ci_island.sh
        run: scripts/ci_island.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the island pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: island-screenshots
          path: build/island-screenshots/
          if-no-files-found: ignore
          retention-days: 14
