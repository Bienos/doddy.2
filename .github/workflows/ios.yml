# Hosted macOS build for Doddy (owner approval 2026-10-10, closes ADR-022's open choice).
# Runs the same scripts/ci.sh a contributor runs locally: pack check, guard, Swift package tests,
# token server / backend / gateway tests, then XcodeGen, one build, and the unit tests and then
# the UI tests on the first available iPhone simulator, restarted between the two (ADR-561).
# No signing team or secrets are used; nothing is deployed.
# Builds the iPhone/iPad app only: the Apple Watch and Mac apps are paused (ADR-572) and are in no
# target of project.yml. The "macOS" below is the runner Xcode needs, not an app being built.
# The macOS job is the slow one. Since ADR-680 (owner, 1 Nov 2026: "why these builds take so long")
# it starts at the same time as the Linux job instead of after it and runs only what needs a Mac
# (`scripts/ci.sh --app-only`: the Swift package tests on Apple's Foundation, the app build, the
# unit tests and the UI tests), leaving the other checks to the Linux job. The repository is
# public, so hosted runners cost nothing (ADR-543). On a pull request it still runs only when the
# change can reach the app build or its tests (ADR-497, scripts/ci_needs_mac.sh); a push to the
# default branch is checked the same way (ADR-675). Run by hand, it always runs.
name: iOS build and tests

on:
  # The default branch is what Render deploys, and it sometimes gets direct pushes (ADR-675): those
  # are tested too. The macOS job runs only when the push can reach the app build (ci_needs_mac.sh).
  push:
    branches: [claude/loving-dirac-uuxoux]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "all: the full run. island: only the Dynamic Island's tests and pictures, about 15-20 minutes (ADR-618). screens: a picture of each screen, about 40-60 minutes (ADR-693). Neither is enough for a merge."
        type: choice
        options: [all, island, screens]
        default: all

concurrency:
  # The quick island run (ADR-618) and the screens run (ADR-693) have their own groups, so they don't cancel a full run of the same branch.
  group: ios-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the macOS job is needed (ADR-497). Cheap: a shallow checkout and a file list.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.decide.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its test merge commit. Its first parent is the base
          # branch, so HEAD^1..HEAD is exactly what the pull request changes.
          fetch-depth: 2

      - name: Does this change need the macOS build?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # What the push changes: from the commit the branch was at before it, to the new head.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch -q --depth=1 origin "$BEFORE" \
              && files=$(git diff --name-only --no-renames "$BEFORE" HEAD); then
              printf '%s\n' "$files" | scripts/ci_needs_mac.sh >> "$GITHUB_OUTPUT"
            else
              echo "Couldn't list what the push changes: the macOS build runs." >&2
              echo "mac=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" != "pull_request" ]; then
            echo "Run by hand: the macOS build runs." >&2
            echo "mac=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q 'HEAD^2' >/dev/null \
            && files=$(git diff --name-only --no-renames 'HEAD^1' HEAD); then
            printf '%s\n' "$files" | scripts/ci_needs_mac.sh >> "$GITHUB_OUTPUT"
          else
            echo "Couldn't list what the pull request changes: the macOS build runs." >&2
            echo "mac=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    # Side by side with `core` (ADR-680), only when `changes` says the app can be affected. A pull
    # request needs both green; a red Linux check no longer holds the Mac build back, so one run
    # shows every failure.
    needs: [changes]
    if: needs.changes.outputs.mac == 'true' && inputs.only != 'island' && inputs.only != 'screens'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install XcodeGen
        run: brew install xcodegen

      # scripts/check_platform_specs.py reads the per-platform XcodeGen specs.
      - name: Install PyYAML
        # Not --user: ci.sh runs python3 -I, which ignores the user site-packages.
        run: python3 -m pip install --break-system-packages pyyaml || python3 -m pip install pyyaml

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          node --version

      - name: scripts/ci.sh --app-only
        # The UI tests on one simulator: two at once were slower and two tests failed on this
        # runner (ADR-680, run 41341166440).
        run: scripts/ci.sh --app-only

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Pictures of the Dynamic Island's views in each conversation state, drawn by
      # DoddyTests/IslandScreenshotTests (ADR-615). Small PNGs, so the look can be checked from here.
      - name: Keep the island pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-screenshots
          path: build/island-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # Everything except the iOS build, on Linux (ADR-137): pack check, guards, agent spec, Swift
  # package tests, token server, backend, gateway and messaging server tests (with Postgres). Cheaper than the macOS job and gives
  # every pull request a real signal even when no hosted Mac is available.
  core:
    if: inputs.only != 'island' && inputs.only != 'screens'
    runs-on: ubuntu-24.04
    # Official Swift image, same toolchain the Linux checks were run with (Swift 6.1).
    container: swift:6.1-noble
    timeout-minutes: 30
    # Disposable database for the messaging server's tests (server/messaging, ADR-139).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doddy
          POSTGRES_PASSWORD: doddy
          POSTGRES_DB: doddy_test
        options: >-
          --health-cmd "pg_isready -U doddy -d doddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://doddy:doddy@postgres:5432/doddy_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SQLite headers and Python for the checks
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3 python3-yaml

      - name: Tool versions
        run: |
          swift --version
          node --version
          python3 --version

      - name: scripts/ci.sh --core-only
        run: scripts/ci.sh --core-only

  # The quick island-only check (ADR-618), run by hand with only=island: no wait for the Linux
  # checks, one build, then only the Dynamic Island's unit and UI tests. Its pictures and the
  # simulator's screenshots are kept like the full run's. Not a substitute for the full run.
  island:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'island'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: scripts/ci_island.sh
        run: scripts/ci_island.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the island pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-screenshots
          path: build/island-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # The screens run (ADR-693), by hand with only=screens: one build, then only
  # DoddyUITests/ScreenAtlasTests, which keeps a picture of each screen it reaches. Pictures only:
  # it verifies nothing about the app's behaviour and is no substitute for the full run.
  screens:
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'screens'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: scripts/ci_screens.sh
        run: scripts/ci_screens.sh

      - name: Keep the screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-atlas
          path: |
            build/screen-atlas/
            build/screen-atlas-attachments/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: build/screen-atlas.xcresult
          if-no-files-found: ignore
          retention-days: 7
