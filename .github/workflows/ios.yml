# Throwaway (claude/motion-probe only, never merged): this branch runs only the motion UI tests
# on a Mac, so a motion fix gets an answer in about 15 minutes instead of the full run's 50.
name: iOS build and tests

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Test classes to run (xcodebuild -only-testing, space separated)"
        default: "DoddyUITests/MotionHopTests DoddyUITests/MotionRideTests DoddyUITests/MotionBehaviourUITests DoddyUITests/MotionEvidenceTests DoddyUITests/MotionSurfaceTests"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TESTS: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate --spec project.yml
      - name: Run the motion UI tests
        run: |
          sim_id=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          args=()
          for t in $TESTS; do args+=("-only-testing:$t"); done
          set -o pipefail
          xcodebuild test -project Doddy.xcodeproj -scheme Doddy \
            -destination "platform=iOS Simulator,id=${sim_id}" "${args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/probe.xcresult" 2>&1 | tee probe.log \
            | grep -E "error: |Test Case .*(passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)"
      - name: Keep the log and the recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe.log
            ${{ runner.temp }}/probe.xcresult
          if-no-files-found: ignore
          retention-days: 3
