# Hosted macOS build for Doddy (owner approval 2026-10-10, closes ADR-022's open choice).
# Runs the same scripts/ci.sh a contributor runs locally: pack check, guard, Swift package tests,
# token server / backend / gateway tests, then XcodeGen + xcodebuild test (unit + UI) on the
# first available iPhone simulator. No signing team or secrets are used; nothing is deployed.
name: iOS build and tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          node --version

      - name: scripts/ci.sh
        run: scripts/ci.sh

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Everything except the iOS build, on Linux (ADR-137): pack check, guards, agent spec, Swift
  # package tests, token server, backend and gateway tests. Cheaper than the macOS job and gives
  # every pull request a real signal even when no hosted Mac is available.
  core:
    runs-on: ubuntu-24.04
    # Official Swift image, same toolchain the Linux checks were run with (Swift 6.1).
    container: swift:6.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SQLite headers and Python for the checks
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3

      - name: Tool versions
        run: |
          swift --version
          node --version
          python3 --version

      - name: scripts/ci.sh --core-only
        run: scripts/ci.sh --core-only

