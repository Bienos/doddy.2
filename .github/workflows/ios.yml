# THROWAWAY PROBE (claude/probe-iphone-device): never merge. Builds the owner's own path, the
# iPhone project (make project-iphone: DoddyiPhone.xcodeproj, no entitlements, no Watch app) for a
# real iPhone (generic/platform=iOS), without signing. The main workflow builds project.yml for the
# simulator only, so this path isn't covered there.
name: iOS build and tests

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iphone-device-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version
      - name: make project-iphone
        run: make project-iphone
      - name: Schemes
        run: xcodebuild -list -project DoddyiPhone.xcodeproj
      - name: Build Doddy for a real iPhone (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project DoddyiPhone.xcodeproj -scheme Doddy -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*entitlement|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors, if any
        if: failure()
        run: grep -n "error:" build.log | head -60 || true
