# Exercise the REAL Shopify Shop MCP catalog via the production adapter, without credentials.
# Search only. No cart, checkout, order, payment, account or delegated spending tools.
# No secrets are used. This job has read-only repository permissions.
name: Shopify UCP live read-only smoke

on:
  pull_request:
    paths:
      - "backend/src/shopify/**"
      - "scripts/shopify_live_readonly_smoke.mjs"
      - ".github/workflows/shopify-ucp-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-readonly-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shopify-readonly-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Build real Shopify adapter
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run build
      - name: Search real Shopify catalog (Poland, no writes)
        run: node scripts/shopify_live_readonly_smoke.mjs
