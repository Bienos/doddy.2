# TestFlight (ADR-694): archive the Doddy iPhone app on a hosted Mac and either VALIDATE it with App Store
# Connect or UPLOAD it to TestFlight. Only ever run by hand ("Run workflow"): no push, schedule or pull request starts
# it, because an upload is an outward action on the owner's Apple account.
#
#   action = validate (the default)   archive, export an .ipa, validate it; nothing is uploaded
#   action = upload                   archive and upload; TestFlight processes the build afterwards
#
# Run `validate` first, read its log, and upload only when it shows no error. By default the run refuses a commit
# whose "iOS build and tests" run is not green (skip_ci_check turns that off). The steps are in scripts/testflight.sh;
# the one-time setup (Apple key, secrets, environment) is in docs/implementation/TESTFLIGHT_WORKFLOW.md.
#
# Secrets live in the `testflight` environment, not in the repository's general secrets, so they reach only this
# job. Add "Required reviewers" to that environment and every run waits for an approval before it can read them.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      action:
        description: "validate: archive and validate with App Store Connect, upload nothing. upload: archive and upload to TestFlight."
        type: choice
        options: [validate, upload]
        default: validate
      marketing_version:
        description: "Version shown to testers, for example 0.1.0. Empty: the project's (project.yml)."
        type: string
        default: ""
      bundle_id:
        description: "Bundle ID. Empty: the project's. Must equal the App Store Connect record; read docs/implementation/TESTFLIGHT_VALIDATION.md before filling this in."
        type: string
        default: ""
      push:
        description: "Build with push notification entitlements (needs Push Notifications on the App ID)."
        type: boolean
        default: true
      skip_ci_check:
        description: "Run even if this commit has no green 'iOS build and tests' run. Leave off."
        type: boolean
        default: false

# Two runs at once would race for the same build number and the same signing assets; a second waits.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  testflight:
    runs-on: macos-latest
    environment: testflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Is this commit green?
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # A pull request's run is recorded against its head commit, a push's against the pushed one.
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ios.yml/runs?head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful 'iOS build and tests' run for ${SHA}. Let that run pass first, or set skip_ci_check (not recommended)."
            exit 1
          fi
          echo "A green 'iOS build and tests' run exists for ${SHA}."

      - name: Is the Apple setup in place?
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID(secret)"
          [ -n "$ISSUER" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID(secret)"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_API_KEY(secret)"
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing in the 'testflight' environment:$missing. See docs/implementation/TESTFLIGHT_WORKFLOW.md."
            exit 1
          fi

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: scripts/testflight.sh ${{ inputs.action }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          # Rises with every run of this workflow, so each upload is higher than the one before.
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          PUSH: ${{ inputs.push && '1' || '0' }}
          OUT_DIR: build/testflight
          ACTION: ${{ inputs.action }}
        run: scripts/testflight.sh "$ACTION"

      # The logs hold build output only (the script never prints the key). Kept a week to read a validation or a failure.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ inputs.action }}-${{ github.run_number }}
          path: |
            build/testflight/*.log
            build/testflight/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7
